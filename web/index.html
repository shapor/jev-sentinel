<!doctype html>
<meta charset="utf-8">
<title>Jev Sentinel</title>
<style>
body{font:18px/1.5 Inter,system-ui,sans-serif;max-width:1200px;margin:auto;padding:32px 24px;background:#0d1117;color:#e6edf3}
h1{font-size:44px;letter-spacing:-.02em;margin:0 0 8px}h2{font-size:22px;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin-top:40px}
table{border-collapse:separate;border-spacing:0;background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden;min-width:520px}
td,th{padding:12px 18px;text-align:right;border-bottom:1px solid #21262d;font-variant-numeric:tabular-nums}
th{color:#8b949e;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
td:first-child,th:first-child{text-align:left}tr:last-child td{border-bottom:0}tr[data-stage]:hover{background:#1f2630}
textarea{width:100%;height:110px;font:15px ui-monospace,monospace;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:12px}
button{margin-top:10px;font:600 16px system-ui;background:#238636;color:#fff;border:0;border-radius:8px;padding:10px 22px;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-all;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px;font-size:13px;color:#8b949e;max-height:6em;overflow:hidden}
.feed div{display:grid;grid-template-columns:90px 1fr 70px;gap:12px;padding:8px 0;border-bottom:1px solid #21262d;align-items:start}
.v{font-weight:800;text-align:center;border-radius:6px;padding:2px 0;font-size:14px}
.v.allow{background:#12361f;color:#3fb950}.v.ask{background:#3d2e0a;color:#d29922}.v.block{background:#42161a;color:#f85149}
.feed code{font-size:13px;color:#8b949e;display:block;white-space:pre-wrap;word-break:break-all;max-height:3em;overflow:hidden}
.panel{border:1px dashed #30363d;border-radius:12px;padding:16px;min-height:120px;color:#8b949e;margin-bottom:12px}
</style>
<h1>Jev Sentinel</h1>

<h2>Panels (TODO)</h2>
<div class="panel"><b>Live agent</b> <span id="liveStats"></span><div class="feed" id="live"></div></div>
<div class="panel" id="replay">TODO: replay feed — GET /api/replay?n=40</div>

<h2>Totals</h2>
<table id="totals"></table>

<h2>Thresholds</h2>
<table id="thresholds"></table>

<h2>Stages</h2>
<table id="stages"></table>
<div id="examples"></div>

<h2>Check an action</h2>
<textarea id="action"></textarea>
<button id="check">Check</button>
<pre id="result"></pre>

<script>
const $ = id => document.getElementById(id);
const row = cells => "<tr>" + cells.map(c => `<td>${c}</td>`).join("") + "</tr>";
const pct = (a, b) => b ? (100 * a / b).toFixed(1) + "%" : "–";

fetch("/api/stats").then(r => r.json()).then(s => {
  const w = s.swarm, b = s.sanctioned;
  $("totals").innerHTML = "<tr><th></th><th>n</th><th>block</th><th>ask</th><th>allow</th><th>regex flag</th><th>p50 ms</th></tr>" +
    [["Swarm Traces", w], ["Sanctioned CTF", b]].map(([k, x]) =>
      row([k, x.n, x.verdicts.block || 0, x.verdicts.ask || 0, x.verdicts.allow || 0, pct(x.regex, x.n), x.ms_p50])).join("");
  $("thresholds").innerHTML = "<tr><th>threshold</th><th>swarm caught</th><th>sanctioned blocked</th></tr>" +
    s.thresholds.map(t => row([t.t, pct(t.swarm_caught, w.n), pct(t.sanctioned_blocked, b.n)])).join("") +
    row(["regex", pct(w.regex, w.n), pct(b.regex, b.n)]);
  $("stages").innerHTML = "<tr><th>stage</th><th>swarm</th><th>sanctioned</th></tr>" +
    Object.keys({...w.stages, ...b.stages}).map(k =>
      `<tr data-stage="${k}" style="cursor:pointer"><td>${k}</td><td>${w.stages[k] || 0}</td><td>${b.stages[k] || 0}</td></tr>`).join("");
  document.querySelectorAll("[data-stage]").forEach(tr => tr.onclick = () =>
    fetch("/api/examples?stage=" + tr.dataset.stage).then(r => r.json()).then(xs => {
      $("examples").innerHTML = xs.map(x => `<div>${x.id} · p_block ${x.p_block}</div><pre></pre>`).join("");
      $("examples").querySelectorAll("pre").forEach((p, i) => p.textContent = xs[i].snippet);
    }));
});

// Render one verdict row; all text comes from the API and is inserted as text, never as HTML.
function feedRow(r, text) {
  const d = document.createElement("div");
  d.innerHTML = `<span class="v ${r.verdict}">${r.verdict.toUpperCase()}</span><span><b></b><code></code></span><span class="small">${r.ms} ms</span>`;
  d.querySelector("b").textContent = r.reason || "";
  d.querySelector("code").textContent = text || "";
  return d;
}

let since = 0, seen = {n: 0, block: 0, ms: []};
setInterval(() => fetch("/api/live?since=" + since).then(r => r.json()).then(rows => rows.forEach(r => {
  since = Math.max(since, r.t);
  $("live").prepend(feedRow(r, r.action));
  seen.n++; if (r.verdict === "block") seen.block++; seen.ms.push(r.ms);
  const ms = [...seen.ms].sort((a, b) => a - b)[seen.ms.length >> 1];
  $("liveStats").textContent = ` · ${seen.n} checks · ${seen.block} blocked · ${ms} ms median`;
})), 1000);

$("check").onclick = () => fetch("/api/check", {method: "POST", body: JSON.stringify({action: $("action").value})})
  .then(r => r.json()).then(r => $("result").textContent = JSON.stringify(r, null, 1));
</script>
