<!doctype html>
<meta charset="utf-8">
<title>Jev Sentinel</title>
<style>
body{font:17px/1.4 system-ui,sans-serif;max-width:1200px;margin:auto;padding:20px;background:#fafafa;color:#111}
table{border-collapse:collapse;margin:8px 0}td,th{border:1px solid #ccc;padding:6px 10px;text-align:right}
td:first-child,th:first-child{text-align:left}textarea{width:100%;height:100px;font:14px monospace}
pre{white-space:pre-wrap;word-break:break-all;background:#eee;padding:6px;font-size:13px;max-height:6em;overflow:hidden}
.panel{border:2px dashed #aaa;padding:12px;min-height:120px}
</style>
<h1>Jev Sentinel</h1>

<h2>Panels (TODO)</h2>
<div class="panel" id="live">TODO: live feed — poll GET /api/live?since=&lt;t&gt;</div>
<div class="panel" id="replay">TODO: replay feed — GET /api/replay?n=40</div>

<h2>Totals</h2>
<table id="totals"></table>

<h2>Thresholds</h2>
<table id="thresholds"></table>

<h2>Stages</h2>
<table id="stages"></table>
<div id="examples"></div>

<h2>Check an action</h2>
<textarea id="action"></textarea>
<button id="check">Check</button>
<pre id="result"></pre>

<script>
const $ = id => document.getElementById(id);
const row = cells => "<tr>" + cells.map(c => `<td>${c}</td>`).join("") + "</tr>";
const pct = (a, b) => b ? (100 * a / b).toFixed(1) + "%" : "–";

fetch("/api/stats").then(r => r.json()).then(s => {
  const w = s.swarm, b = s.sanctioned;
  $("totals").innerHTML = "<tr><th></th><th>n</th><th>block</th><th>ask</th><th>allow</th><th>regex flag</th><th>p50 ms</th></tr>" +
    [["Swarm Traces", w], ["Sanctioned CTF", b]].map(([k, x]) =>
      row([k, x.n, x.verdicts.block || 0, x.verdicts.ask || 0, x.verdicts.allow || 0, pct(x.regex, x.n), x.ms_p50])).join("");
  $("thresholds").innerHTML = "<tr><th>threshold</th><th>swarm caught</th><th>sanctioned blocked</th></tr>" +
    s.thresholds.map(t => row([t.t, pct(t.swarm_caught, w.n), pct(t.sanctioned_blocked, b.n)])).join("") +
    row(["regex", pct(w.regex, w.n), pct(b.regex, b.n)]);
  $("stages").innerHTML = "<tr><th>stage</th><th>swarm</th><th>sanctioned</th></tr>" +
    Object.keys({...w.stages, ...b.stages}).map(k =>
      `<tr data-stage="${k}" style="cursor:pointer"><td>${k}</td><td>${w.stages[k] || 0}</td><td>${b.stages[k] || 0}</td></tr>`).join("");
  document.querySelectorAll("[data-stage]").forEach(tr => tr.onclick = () =>
    fetch("/api/examples?stage=" + tr.dataset.stage).then(r => r.json()).then(xs => {
      $("examples").innerHTML = xs.map(x => `<div>${x.id} · p_block ${x.p_block}</div><pre></pre>`).join("");
      $("examples").querySelectorAll("pre").forEach((p, i) => p.textContent = xs[i].snippet);
    }));
});

$("check").onclick = () => fetch("/api/check", {method: "POST", body: JSON.stringify({action: $("action").value})})
  .then(r => r.json()).then(r => $("result").textContent = JSON.stringify(r, null, 1));
</script>
